databaseChangeLog:
  - changeSet:
      id: "20251115105324"
      author: Rustam Khudoyan
      comment: Создание последовательности ID для товаров
      preConditions:
        - onFail: CONTINUE
        - not:
            - sequenceExists:
                schemaName: ${schema}
                sequenceName: item_id_seq
      changes:
        - createSequence:
            schemaName: ${schema}
            sequenceName: item_id_seq
            startValue: 1
            incrementBy: 50
            